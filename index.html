<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder - Create Professional CV in Minutes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        @media (max-width: 1024px) { .container { grid-template-columns: 1fr; } }

        /* Templates Bar */
        .templates-bar {
            grid-column: 1 / -1;
            background: white;
            border-radius: 16px;
            padding: 20px 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .templates-bar h3 {
            color: #333;
            font-size: 1rem;
            margin-right: 10px;
        }
        .template-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s;
            color: #555;
        }
        .template-btn:hover, .template-btn.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        /* Form Section */
        .form-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        .form-header { text-align: center; margin-bottom: 25px; }
        .form-header h1 { color: #667eea; font-size: 1.8rem; margin-bottom: 5px; }
        .form-header p { color: #888; font-size: 0.9rem; }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #444;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        .form-group textarea { min-height: 80px; resize: vertical; }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            margin-top: 10px;
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(17, 153, 142, 0.4);
        }
        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            margin-bottom: 10px;
        }

        .dynamic-section {
            background: #f8f9ff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px dashed #667eea;
        }
        .dynamic-section h3 {
            color: #667eea;
            font-size: 1rem;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .add-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .add-btn:hover { background: #764ba2; }

        .item-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
            position: relative;
        }
        .item-row input {
            padding: 8px 12px;
            font-size: 0.85rem;
        }
        .remove-btn {
            position: absolute;
            right: -30px;
            top: 50%;
            transform: translateY(-50%);
            background: #ff4757;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Preview Section */
        .preview-section {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .preview-header { text-align: center; margin-bottom: 20px; }
        .preview-header h2 { color: #444; font-size: 1.3rem; }

        #resume-preview {
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        @media (max-width: 1024px) {
            #resume-preview { width: 100%; min-height: auto; }
        }

        .resume {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 297mm;
        }
        @media (max-width: 768px) { .resume { grid-template-columns: 1fr; } }

        .resume-sidebar {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 40px 25px;
        }
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #667eea;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #667eea;
            font-size: 3rem;
            font-weight: 800;
            color: white;
            overflow: hidden;
        }
        .sidebar-section { margin-bottom: 30px; }
        .sidebar-title {
            font-size: 1rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            word-break: break-all;
        }
        .contact-icon {
            width: 30px;
            height: 30px;
            background: rgba(102, 126, 234, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .skill-item { margin-bottom: 15px; }
        .skill-name { font-size: 0.85rem; margin-bottom: 5px; }
        .skill-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        .skill-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            transition: width 0.5s;
        }
        .lang-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }
        .lang-level { color: #667eea; font-weight: 600; }

        .resume-main {
            padding: 50px 40px;
            background: white;
        }
        .name-section { margin-bottom: 30px; }
        .name-section h1 {
            font-size: 2.5rem;
            color: #1a1a2e;
            font-weight: 800;
            line-height: 1.2;
        }
        .name-section h2 {
            font-size: 1.2rem;
            color: #667eea;
            font-weight: 600;
            margin-top: 5px;
        }
        .main-section { margin-bottom: 35px; }
        .main-title {
            font-size: 1.3rem;
            color: #1a1a2e;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .main-title::before {
            content: '';
            width: 8px;
            height: 25px;
            background: linear-gradient(180deg, #667eea, #764ba2);
            border-radius: 4px;
        }
        .exp-item, .edu-item {
            margin-bottom: 25px;
            position: relative;
            padding-left: 20px;
            border-left: 2px solid #e0e0e0;
        }
        .exp-item::before, .edu-item::before {
            content: '';
            position: absolute;
            left: -6px;
            top: 5px;
            width: 10px;
            height: 10px;
            background: #667eea;
            border-radius: 50%;
        }
        .exp-header, .edu-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 8px;
        }
        .exp-title, .edu-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1a1a2e;
        }
        .exp-company, .edu-school {
            font-size: 0.95rem;
            color: #667eea;
            font-weight: 600;
        }
        .exp-date, .edu-date {
            font-size: 0.8rem;
            color: #888;
            background: #f0f0f0;
            padding: 3px 10px;
            border-radius: 15px;
            white-space: nowrap;
        }
        .exp-desc, .edu-desc {
            font-size: 0.9rem;
            color: #555;
            line-height: 1.7;
        }
        .summary-text {
            font-size: 0.95rem;
            color: #555;
            line-height: 1.8;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
        @media print {
            body { background: white; padding: 0; }
            .form-section, .preview-section, .templates-bar { display: none; }
            #resume-preview { box-shadow: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- TEMPLATES BAR -->
    <div class="templates-bar">
        <h3>🚀 Quick Start Templates:</h3>
        <button class="template-btn" onclick="loadTemplate('software')">💻 Software Engineer</button>
        <button class="template-btn" onclick="loadTemplate('designer')">🎨 UI/UX Designer</button>
        <button class="template-btn" onclick="loadTemplate('marketing')">📈 Marketing Manager</button>
        <button class="template-btn" onclick="clearAll()" style="border-color:#ff4757;color:#ff4757;">🗑️ Clear All</button>
    </div>

    <!-- FORM SECTION -->
    <div class="form-section">
        <div class="form-header">
            <h1>📝 Resume Builder</h1>
            <p>Fill your details and see live preview</p>
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="fullName" placeholder="e.g. John Anderson" oninput="updateResume()">
        </div>

        <div class="form-group">
            <label>Job Title</label>
            <input type="text" id="jobTitle" placeholder="e.g. Senior Software Engineer" oninput="updateResume()">
        </div>

        <div class="form-group">
            <label>Professional Summary</label>
            <textarea id="summary" placeholder="e.g. Results-driven software engineer with 5+ years of experience in full-stack development..." oninput="updateResume()"></textarea>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="john.anderson@email.com" oninput="updateResume()">
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input type="tel" id="phone" placeholder="+1 (555) 123-4567" oninput="updateResume()">
        </div>

        <div class="form-group">
            <label>Website / LinkedIn</label>
            <input type="text" id="website" placeholder="linkedin.com/in/johnanderson" oninput="updateResume()">
        </div>

        <div class="form-group">
            <label>Location</label>
            <input type="text" id="location" placeholder="San Francisco, CA" oninput="updateResume()">
        </div>

        <div class="dynamic-section">
            <h3>💡 Skills <button class="add-btn" onclick="addSkill()">+ Add</button></h3>
            <div id="skillsContainer"></div>
        </div>

        <div class="dynamic-section">
            <h3>🌐 Languages <button class="add-btn" onclick="addLanguage()">+ Add</button></h3>
            <div id="languagesContainer"></div>
        </div>

        <div class="dynamic-section">
            <h3>💼 Work Experience <button class="add-btn" onclick="addExperience()">+ Add</button></h3>
            <div id="experienceContainer"></div>
        </div>

        <div class="dynamic-section">
            <h3>🎓 Education <button class="add-btn" onclick="addEducation()">+ Add</button></h3>
            <div id="educationContainer"></div>
        </div>

        <button class="btn btn-success" onclick="downloadPDF()">📥 Download Resume (PDF)</button>
        <div class="loading" id="loading">Generating PDF...</div>
    </div>

    <!-- PREVIEW SECTION -->
    <div class="preview-section">
        <div class="preview-header">
            <h2>👁️ Live Preview</h2>
        </div>
        <div id="resume-preview"></div>
    </div>
</div>

<script>
// ===== TEMPLATES DATA =====
const templates = {
    software: {
        fullName: "John Anderson",
        jobTitle: "Senior Software Engineer",
        summary: "Results-driven Software Engineer with 6+ years of experience designing, developing, and deploying scalable web applications. Proficient in JavaScript, React, Node.js, and cloud technologies. Passionate about writing clean, maintainable code and mentoring junior developers.",
        email: "john.anderson@email.com",
        phone: "+1 (555) 123-4567",
        website: "github.com/johnanderson",
        location: "San Francisco, CA",
        skills: [
            { name: "JavaScript / TypeScript", level: 95 },
            { name: "React & Next.js", level: 90 },
            { name: "Node.js & Express", level: 85 },
            { name: "Python & Django", level: 80 },
            { name: "AWS & Docker", level: 75 },
            { name: "PostgreSQL & MongoDB", level: 80 }
        ],
        languages: [
            { name: "English", level: "Native" },
            { name: "Spanish", level: "Intermediate" }
        ],
        experiences: [
            {
                title: "Senior Software Engineer",
                company: "TechCorp Inc.",
                date: "2021 - Present",
                desc: "Lead a team of 5 developers in building a SaaS platform serving 100K+ users. Reduced API response time by 40% through optimization."
            },
            {
                title: "Full Stack Developer",
                company: "StartupXYZ",
                date: "2018 - 2021",
                desc: "Developed and maintained 3 client projects using React and Node.js. Implemented CI/CD pipelines reducing deployment time by 60%."
            }
        ],
        educations: [
            {
                degree: "B.S. Computer Science",
                school: "Stanford University",
                date: "2014 - 2018",
                desc: "GPA: 3.8/4.0. Specialization in Artificial Intelligence and Software Engineering."
            }
        ]
    },
    designer: {
        fullName: "Sarah Mitchell",
        jobTitle: "Senior UI/UX Designer",
        summary: "Creative UI/UX Designer with 5+ years of experience crafting intuitive digital experiences for web and mobile platforms. Expert in user research, wireframing, prototyping, and design systems. Strong advocate for accessibility and inclusive design.",
        email: "sarah.mitchell@email.com",
        phone: "+1 (555) 987-6543",
        website: "behance.net/sarahmitchell",
        location: "New York, NY",
        skills: [
            { name: "Figma & Sketch", level: 95 },
            { name: "Adobe Creative Suite", level: 90 },
            { name: "Prototyping", level: 85 },
            { name: "User Research", level: 80 },
            { name: "HTML/CSS", level: 75 },
            { name: "Design Systems", level: 85 }
        ],
        languages: [
            { name: "English", level: "Native" },
            { name: "French", level: "Conversational" }
        ],
        experiences: [
            {
                title: "Senior UI/UX Designer",
                company: "DesignStudio Co.",
                date: "2020 - Present",
                desc: "Redesigned the core product increasing user engagement by 35%. Created a comprehensive design system used across 4 products."
            },
            {
                title: "UI Designer",
                company: "Creative Agency",
                date: "2017 - 2020",
                desc: "Designed interfaces for 20+ clients including Fortune 500 companies. Won 3 design awards for mobile app projects."
            }
        ],
        educations: [
            {
                degree: "B.F.A. Graphic Design",
                school: "Rhode Island School of Design",
                date: "2013 - 2017",
                desc: "Focus on Interaction Design and Visual Communication."
            }
        ]
    },
    marketing: {
        fullName: "Michael Chen",
        jobTitle: "Digital Marketing Manager",
        summary: "Data-driven Marketing Manager with 7+ years of experience developing and executing multi-channel marketing strategies. Proven track record of increasing revenue by 150% through SEO, content marketing, and paid advertising campaigns.",
        email: "michael.chen@email.com",
        phone: "+1 (555) 456-7890",
        website: "linkedin.com/in/michaelchen",
        location: "Austin, TX",
        skills: [
            { name: "SEO & SEM", level: 95 },
            { name: "Google Analytics", level: 90 },
            { name: "Content Strategy", level: 85 },
            { name: "Social Media Marketing", level: 90 },
            { name: "Email Marketing", level: 80 },
            { name: "PPC Campaigns", level: 85 }
        ],
        languages: [
            { name: "English", level: "Native" },
            { name: "Mandarin", level: "Fluent" }
        ],
        experiences: [
            {
                title: "Digital Marketing Manager",
                company: "GrowthHackers Inc.",
                date: "2019 - Present",
                desc: "Manage $2M annual ad budget across Google Ads and Facebook. Increased ROI by 200% through A/B testing and audience segmentation."
            },
            {
                title: "Marketing Specialist",
                company: "E-Commerce Giant",
                date: "2016 - 2019",
                desc: "Grew organic traffic by 300% in 18 months. Launched email campaigns with 45% open rates and $500K in attributed revenue."
            }
        ],
        educations: [
            {
                degree: "MBA Marketing",
                school: "University of Texas at Austin",
                date: "2014 - 2016",
                desc: "Concentration in Digital Marketing and Consumer Behavior."
            }
        ]
    }
};

// ===== STATE =====
let skills = [];
let languages = [];
let experiences = [];
let educations = [];

// ===== TEMPLATE LOADER =====
function loadTemplate(type) {
    const t = templates[type];
    if (!t) return;

    document.getElementById('fullName').value = t.fullName;
    document.getElementById('jobTitle').value = t.jobTitle;
    document.getElementById('summary').value = t.summary;
    document.getElementById('email').value = t.email;
    document.getElementById('phone').value = t.phone;
    document.getElementById('website').value = t.website;
    document.getElementById('location').value = t.location;

    skills = t.skills.map(s => ({...s}));
    languages = t.languages.map(l => ({...l}));
    experiences = t.experiences.map(e => ({...e}));
    educations = t.educations.map(e => ({...e}));

    renderSkills();
    renderLanguages();
    renderExperiences();
    renderEducations();
    updateResume();

    // Highlight active button
    document.querySelectorAll('.template-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
}

function clearAll() {
    document.getElementById('fullName').value = '';
    document.getElementById('jobTitle').value = '';
    document.getElementById('summary').value = '';
    document.getElementById('email').value = '';
    document.getElementById('phone').value = '';
    document.getElementById('website').value = '';
    document.getElementById('location').value = '';

    skills = [{ name: '', level: 80 }];
    languages = [{ name: '', level: 'Intermediate' }];
    experiences = [{ title: '', company: '', date: '', desc: '' }];
    educations = [{ degree: '', school: '', date: '', desc: '' }];

    renderSkills();
    renderLanguages();
    renderExperiences();
    renderEducations();
    updateResume();

    document.querySelectorAll('.template-btn').forEach(btn => btn.classList.remove('active'));
}

// ===== ADD FUNCTIONS =====
function addSkill() { skills.push({ name: '', level: 80 }); renderSkills(); updateResume(); }
function addLanguage() { languages.push({ name: '', level: 'Intermediate' }); renderLanguages(); updateResume(); }
function addExperience() { experiences.push({ title: '', company: '', date: '', desc: '' }); renderExperiences(); updateResume(); }
function addEducation() { educations.push({ degree: '', school: '', date: '', desc: '' }); renderEducations(); updateResume(); }

// ===== RENDER FORM FIELDS =====
function renderSkills() {
    const container = document.getElementById('skillsContainer');
    container.innerHTML = skills.map((skill, i) => `
        <div class="item-row">
            <input type="text" placeholder="e.g. JavaScript" value="${skill.name}" onchange="skills[${i}].name=this.value; updateResume()">
            <input type="range" min="20" max="100" value="${skill.level}" onchange="skills[${i}].level=this.value; updateResume()">
            ${skills.length > 1 ? `<button class="remove-btn" onclick="skills.splice(${i},1); renderSkills(); updateResume()">×</button>` : ''}
        </div>
    `).join('');
}

function renderLanguages() {
    const container = document.getElementById('languagesContainer');
    container.innerHTML = languages.map((lang, i) => `
        <div class="item-row">
            <input type="text" placeholder="e.g. English" value="${lang.name}" onchange="languages[${i}].name=this.value; updateResume()">
            <select onchange="languages[${i}].level=this.value; updateResume()" style="padding:8px;border-radius:8px;border:2px solid #e0e0e0;font-family:'Inter'">
                <option value="Beginner" ${lang.level === 'Beginner' ? 'selected' : ''}>Beginner</option>
                <option value="Intermediate" ${lang.level === 'Intermediate' ? 'selected' : ''}>Intermediate</option>
                <option value="Advanced" ${lang.level === 'Advanced' ? 'selected' : ''}>Advanced</option>
                <option value="Fluent" ${lang.level === 'Fluent' ? 'selected' : ''}>Fluent</option>
                <option value="Native" ${lang.level === 'Native' ? 'selected' : ''}>Native</option>
            </select>
            ${languages.length > 1 ? `<button class="remove-btn" onclick="languages.splice(${i},1); renderLanguages(); updateResume()">×</button>` : ''}
        </div>
    `).join('');
}

function renderExperiences() {
    const container = document.getElementById('experienceContainer');
    container.innerHTML = experiences.map((exp, i) => `
        <div style="margin-bottom:15px;padding:10px;background:white;border-radius:8px;">
            <div class="item-row">
                <input type="text" placeholder="Job Title" value="${exp.title}" onchange="experiences[${i}].title=this.value; updateResume()">
                <input type="text" placeholder="Company" value="${exp.company}" onchange="experiences[${i}].company=this.value; updateResume()">
            </div>
            <div class="item-row">
                <input type="text" placeholder="Period (e.g. 2020 - 2023)" value="${exp.date}" onchange="experiences[${i}].date=this.value; updateResume()">
                <input type="text" placeholder="Description" value="${exp.desc}" onchange="experiences[${i}].desc=this.value; updateResume()">
            </div>
            ${experiences.length > 1 ? `<button class="remove-btn" style="position:static;transform:none;margin-top:5px;" onclick="experiences.splice(${i},1); renderExperiences(); updateResume()">× Remove</button>` : ''}
        </div>
    `).join('');
}

function renderEducations() {
    const container = document.getElementById('educationContainer');
    container.innerHTML = educations.map((edu, i) => `
        <div style="margin-bottom:15px;padding:10px;background:white;border-radius:8px;">
            <div class="item-row">
                <input type="text" placeholder="Degree" value="${edu.degree}" onchange="educations[${i}].degree=this.value; updateResume()">
                <input type="text" placeholder="School / University" value="${edu.school}" onchange="educations[${i}].school=this.value; updateResume()">
            </div>
            <div class="item-row">
                <input type="text" placeholder="Period" value="${edu.date}" onchange="educations[${i}].date=this.value; updateResume()">
                <input type="text" placeholder="Description" value="${edu.desc}" onchange="educations[${i}].desc=this.value; updateResume()">
            </div>
            ${educations.length > 1 ? `<button class="remove-btn" style="position:static;transform:none;margin-top:5px;" onclick="educations.splice(${i},1); renderEducations(); updateResume()">× Remove</button>` : ''}
        </div>
    `).join('');
}

// ===== UPDATE RESUME PREVIEW =====
function updateResume() {
    const name = document.getElementById('fullName').value || 'Your Name';
    const title = document.getElementById('jobTitle').value || 'Job Title';
    const summary = document.getElementById('summary').value || 'Write a brief professional summary about yourself...';
    const email = document.getElementById('email').value;
    const phone = document.getElementById('phone').value;
    const website = document.getElementById('website').value;
    const location = document.getElementById('location').value;

    const firstLetter = name.charAt(0).toUpperCase();

    const skillsHTML = skills.filter(s => s.name).map(s => `
        <div class="skill-item">
            <div class="skill-name">${s.name}</div>
            <div class="skill-bar"><div class="skill-fill" style="width:${s.level}%"></div></div>
        </div>
    `).join('');

    const languagesHTML = languages.filter(l => l.name).map(l => `
        <div class="lang-item">
            <span>${l.name}</span>
            <span class="lang-level">${l.level}</span>
        </div>
    `).join('');

    const experienceHTML = experiences.filter(e => e.title).map(e => `
        <div class="exp-item">
            <div class="exp-header">
                <div>
                    <div class="exp-title">${e.title}</div>
                    <div class="exp-company">${e.company}</div>
                </div>
                <div class="exp-date">${e.date}</div>
            </div>
            <div class="exp-desc">${e.desc}</div>
        </div>
    `).join('');

    const educationHTML = educations.filter(e => e.degree).map(e => `
        <div class="edu-item">
            <div class="edu-header">
                <div>
                    <div class="edu-title">${e.degree}</div>
                    <div class="edu-school">${e.school}</div>
                </div>
                <div class="edu-date">${e.date}</div>
            </div>
            <div class="edu-desc">${e.desc}</div>
        </div>
    `).join('');

    const contactHTML = `
        ${email ? `<div class="contact-item"><div class="contact-icon">✉</div>${email}</div>` : ''}
        ${phone ? `<div class="contact-item"><div class="contact-icon">📞</div>${phone}</div>` : ''}
        ${website ? `<div class="contact-item"><div class="contact-icon">🌐</div>${website}</div>` : ''}
        ${location ? `<div class="contact-item"><div class="contact-icon">📍</div>${location}</div>` : ''}
    `;

    document.getElementById('resume-preview').innerHTML = `
        <div class="resume" id="resume-content">
            <div class="resume-sidebar">
                <div class="profile-img">${firstLetter}</div>
                
                <div class="sidebar-section">
                    <div class="sidebar-title">Contact</div>
                    ${contactHTML || '<div style="font-size:0.85rem;color:#aaa;">Enter contact info</div>'}
                </div>

                ${skillsHTML ? `
                <div class="sidebar-section">
                    <div class="sidebar-title">Skills</div>
                    ${skillsHTML}
                </div>
                ` : ''}

                ${languagesHTML ? `
                <div class="sidebar-section">
                    <div class="sidebar-title">Languages</div>
                    ${languagesHTML}
                </div>
                ` : ''}
            </div>

            <div class="resume-main">
                <div class="name-section">
                    <h1>${name}</h1>
                    <h2>${title}</h2>
                </div>

                <div class="main-section">
                    <div class="main-title">Professional Summary</div>
                    <div class="summary-text">${summary}</div>
                </div>

                ${experienceHTML ? `
                <div class="main-section">
                    <div class="main-title">Work Experience</div>
                    ${experienceHTML}
                </div>
                ` : ''}

                ${educationHTML ? `
                <div class="main-section">
                    <div class="main-title">Education</div>
                    ${educationHTML}
                </div>
                ` : ''}
            </div>
        </div>
    `;
}

// ===== DOWNLOAD PDF =====
function downloadPDF() {
    const element = document.getElementById('resume-content');
    if (!element) {
        alert('Please enter your details first');
        return;
    }

    document.getElementById('loading').style.display = 'block';

    const opt = {
        margin: 0,
        filename: 'my-resume.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    html2pdf().set(opt).from(element).save().then(() => {
        document.getElementById('loading').style.display = 'none';
    }).catch(err => {
        console.error(err);
        document.getElementById('loading').style.display = 'none';
        alert('Error generating PDF. Please try again.');
    });
}

// ===== INITIALIZE =====
window.onload = function() {
    addSkill();
    addLanguage();
    addExperience();
    addEducation();
    updateResume();
};
</script>
